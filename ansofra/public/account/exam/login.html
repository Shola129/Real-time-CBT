<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Start Examination — EduTest CBT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

<div class="bg-stage">
  <div class="bg-slide bg-slide-1 active"></div>
  <div class="bg-slide bg-slide-2"></div>
  <div class="bg-slide bg-slide-3"></div>
  <div class="bg-icons">
    <i class="fas fa-graduation-cap"></i>
    <i class="fas fa-desktop"></i>
    <i class="fas fa-pen-nib"></i>
    <i class="fas fa-clipboard-check"></i>
  </div>
</div>
<div class="bg-overlay"></div>

<div class="page">
  <div class="entry-card">

    <div class="entry-heading"><i class="fas fa-graduation-cap"></i> Start Examination</div>

    <div class="entry-alert" id="entryAlert"></div>

    <div class="input-wrap">
      <i class="fas fa-user-graduate field-icon"></i>
      <input type="text" id="inp-regnum" name="regnum" placeholder="Enter Registration Number" autocomplete="off" onkeydown="if(event.key==='Enter') startExamination()"/>
    </div>

    <button class="btn-start" id="btn-start" onclick="startExamination()">
      <span class="spinner"></span>
      <span class="btn-label">Start Examination</span>
    </button>

  </div>
</div>
<link rel="stylesheet" href="../public/css/exam/login.css">
<script src="../public/js/exam/index.js"></script>
</body>
</html>

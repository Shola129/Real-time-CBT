<!-- ══════════════════════════════════════════════════
     STUDENT DRAWER  JAVASCRIPT
     Paste alongside your existing JS, or at the
     bottom of the page before </body>
══════════════════════════════════════════════════ -->
<script>
/* ── State ──────────────────────────────────────── */
let _currentStudentReg = null;

/* ── Open drawer ────────────────────────────────── */
async function openStudentDrawer(regNum, fullname, email, department, role, phone, gender, dob, state, year, created, lastSeen) {
  _currentStudentReg = regNum;

  /* Avatar initials */
  const initials = (fullname || '??').split(' ')
    .map(w => w[0]).join('').substring(0, 2).toUpperCase();
  document.getElementById('stdAvatar').textContent = initials;

  /* Header */
  document.getElementById('stdDrawerName').textContent = fullname  || '—';
  document.getElementById('stdDrawerReg').textContent  = regNum    || '—';

  /* Status chips */
  document.getElementById('stdChipRole').textContent = role       || 'Student';
  document.getElementById('stdChipDept').textContent = department || '—';

  /* Personal info */
  document.getElementById('stdInfoFullname').textContent = fullname   || '—';
  document.getElementById('stdInfoEmail').textContent    = email      || '—';
  document.getElementById('stdInfoPhone').textContent    = phone      || '—';
  document.getElementById('stdInfoGender').textContent   = gender     || '—';
  document.getElementById('stdInfoDob').textContent      = dob        || '—';
  document.getElementById('stdInfoState').textContent    = state      || '—';

  /* Academic info */
  document.getElementById('stdInfoRegNum').textContent   = regNum     || '—';
  document.getElementById('stdInfoDept').textContent     = department || '—';
  document.getElementById('stdInfoYear').textContent     = year       || '—';
  document.getElementById('stdInfoRole').textContent     = role       || '—';

  /* Account info */
  document.getElementById('stdInfoCreated').textContent  = created   || '—';
  document.getElementById('stdInfoLastSeen').textContent = lastSeen  || '—';

  /* Show loading state for results */
  document.getElementById('stdResultArea').innerHTML = `
    <div class="std-result-loading" id="stdResultLoading">
      <i class="fas fa-circle-notch fa-spin"></i> Loading exam result…
    </div>`;

  /* Open drawer */
  document.getElementById('stdDrawerBackdrop').classList.add('open');
  document.body.style.overflow = 'hidden';

  /* Fetch exam result asynchronously */
  await _loadStudentResult(regNum);
}

/* ── Close drawer ───────────────────────────────── */
function closeStudentDrawer() {
  document.getElementById('stdDrawerBackdrop').classList.remove('open');
  document.body.style.overflow = '';
  _currentStudentReg = null;
}

/* ── Load student exam result ───────────────────── */
async function _loadStudentResult(regNum) {
  const resultArea = document.getElementById('stdResultArea');
  try {
    const res    = await fetch('/cbt/ansofra/apiadmin/display/result', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ regNum: regNum })
    });
    const data = await res.json();

    if (data.status === 'success' && data.response && data.response.length > 0) {
      const r = data.response[0];

      /* Parse subject breakdown if it exists */
      let subjectRows = '';
      try {
        const subjects = JSON.parse(r.subjectAndScore || '[]');
        if (subjects.length > 0) {
          const rows = subjects.map(s => `
            <tr>
              <td>${s.subject || '—'}</td>
              <td><span class="std-score-badge">${s.score ?? '—'}</span></td>
              <td style="font-size:11.5px;color:#64748B;">${s.correctAnswers ?? '—'} / ${s.totalQuestions ?? '—'}</td>
            </tr>`).join('');
          subjectRows = `
            <table class="std-subj-table" style="margin-top:14px;">
              <thead>
                <tr><th>Subject</th><th>Score</th><th>Correct / Total</th></tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>`;
        }
      } catch (_) { /* ignore parse error */ }

      const isPublished = String(r.publish || '').toLowerCase();
      const publishedChip = (isPublished === 'yes' || isPublished === '1' || isPublished === 'true')
        ? '<span class="std-publish-chip yes"><i class="fas fa-check"></i> Published</span>'
        : '<span class="std-publish-chip no"><i class="fas fa-clock"></i> Pending</span>';

      resultArea.innerHTML = `
        <div class="std-result-card">
          <div class="std-result-score-block">
            <div class="std-result-score-big">${r.overAll ?? '—'}</div>
            <div class="std-result-score-label">Overall Score</div>
          </div>
          <div class="std-result-meta">
            <div class="std-result-meta-row">
              <i class="fas fa-building"></i>
              <span>${r.department || '—'}</span>
            </div>
            <div class="std-result-meta-row">
              <i class="fas fa-calendar"></i>
              <span><strong>Submitted:</strong> ${r.createdAt || '—'}</span>
            </div>
            <div class="std-result-meta-row">
              <i class="fas fa-paper-plane"></i>
              ${publishedChip}
            </div>
          </div>
        </div>
        ${subjectRows}`;

    } else {
      /* No result found */
      resultArea.innerHTML = `
        <div class="std-no-result">
          <i class="fas fa-inbox"></i>
          No exam result found for this student yet.<br>
          <small>They may not have completed the examination.</small>
        </div>`;
    }
  } catch (err) {
    resultArea.innerHTML = `
      <div class="std-no-result">
        <i class="fas fa-triangle-exclamation" style="color:#DC2626;"></i>
        Could not load result. Please check your connection and try again.
      </div>`;
    console.error('Student result fetch error:', err);
  }
}

/* ── ESC key closes drawer ──────────────────────── */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeStudentDrawer();
});
</script>

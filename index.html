<!-- ════════════════════════════════════════════════════
     RESULT DETAILS DRAWER  (slide-in from right)
════════════════════════════════════════════════════ -->
<div class="rsd-backdrop" id="rsdBackdrop" onclick="closeResultDrawer()">
  <div class="rsd-drawer" id="rsdDrawer" onclick="event.stopPropagation()">

    <!-- ── Header ───────────────────────────────── -->
    <div class="rsd-header">
      <div class="rsd-header-left">
        <div class="rsd-avatar" id="rsdAvatar">--</div>
        <div>
          <div class="rsd-name" id="rsdName">Student Name</div>
          <div class="rsd-reg"  id="rsdReg">—</div>
        </div>
      </div>
      <button class="rsd-close" onclick="closeResultDrawer()" aria-label="Close drawer">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- ── Chips ─────────────────────────────────── -->
    <div class="rsd-chips">
      <span class="rsd-chip rsd-chip-dept" id="rsdChipDept">—</span>
      <span class="rsd-chip rsd-chip-status" id="rsdChipStatus">—</span>
    </div>

    <!-- ── Body ─────────────────────────────────── -->
    <div class="rsd-body">

      <!-- Overall score hero -->
      <div class="rsd-score-hero" id="rsdScoreHero">
        <div class="rsd-score-block">
          <div class="rsd-score-big" id="rsdScoreBig">—</div>
          <div class="rsd-score-label">Overall Score</div>
        </div>
        <div class="rsd-score-meta">
          <div class="rsd-meta-row">
            <i class="fas fa-user"></i>
            <span id="rsdMetaName">—</span>
          </div>
          <div class="rsd-meta-row">
            <i class="fas fa-id-badge"></i>
            <span id="rsdMetaReg">—</span>
          </div>
          <div class="rsd-meta-row">
            <i class="fas fa-building"></i>
            <span id="rsdMetaDept">—</span>
          </div>
          <div class="rsd-meta-row">
            <i class="fas fa-calendar-check"></i>
            <span id="rsdMetaDate">—</span>
          </div>
        </div>
      </div>

      <!-- ── Summary stat pills ──────────────────── -->
      <div class="rsd-summary-row" id="rsdSummaryRow">
        <div class="rsd-summary-pill">
          <div class="rsd-sum-val" id="rsdSumSubjects">—</div>
          <div class="rsd-sum-lbl">Subjects</div>
        </div>
        <div class="rsd-summary-pill">
          <div class="rsd-sum-val" id="rsdSumTotalQ">—</div>
          <div class="rsd-sum-lbl">Total Questions</div>
        </div>
        <div class="rsd-summary-pill">
          <div class="rsd-sum-val" id="rsdSumCorrect">—</div>
          <div class="rsd-sum-lbl">Correct Answers</div>
        </div>
        <div class="rsd-summary-pill rsd-pill-score">
          <div class="rsd-sum-val" id="rsdSumPercent">—</div>
          <div class="rsd-sum-lbl">Percentage</div>
        </div>
      </div>

      <div class="rsd-divider"></div>

      <!-- ── Per-subject breakdown ────────────────── -->
      <div class="rsd-section-label">
        <i class="fas fa-list-check"></i> Subject Breakdown
      </div>

      <div id="rsdSubjectArea">
        <div class="rsd-loading">
          <i class="fas fa-circle-notch fa-spin"></i> Loading subject scores…
        </div>
      </div>

      <div class="rsd-divider"></div>

      <!-- ── Per-question detail (expandable) ────── -->
      <div class="rsd-section-label" style="justify-content:space-between;">
        <span><i class="fas fa-circle-question"></i> Question Attempts</span>
        <button class="rsd-toggle-btn" id="rsdToggleQBtn" onclick="toggleQuestionDetail()">
          <i class="fas fa-chevron-down" id="rsdToggleIcon"></i> Show Details
        </button>
      </div>
      <div id="rsdQuestionDetail" style="display:none;">
        <div class="rsd-loading" id="rsdQLoading">
          <i class="fas fa-circle-notch fa-spin"></i> Loading question attempts…
        </div>
      </div>

      <div class="rsd-divider"></div>

      <!-- ── Publish control ────────────────────── -->
      <div class="rsd-section-label">
        <i class="fas fa-paper-plane"></i> Result Publishing
      </div>
      <div class="rsd-publish-row">
        <div class="rsd-publish-status" id="rsdPublishStatus">
          <i class="fas fa-circle-info"></i> Status: <strong id="rsdPublishLabel">—</strong>
        </div>
        <button class="rsd-publish-btn" id="rsdPublishBtn" onclick="publishSingleResult()">
          <i class="fas fa-paper-plane"></i> Publish Result
        </button>
      </div>

    </div><!-- /rsd-body -->

    <!-- ── Footer ───────────────────────────────── -->
    <div class="rsd-footer">
      <button class="rsd-footer-btn rsd-btn-secondary" onclick="closeResultDrawer()">
        <i class="fas fa-times"></i> Close
      </button>
      <button class="rsd-footer-btn rsd-btn-print" onclick="printStudentResult()">
        <i class="fas fa-print"></i> Print
      </button>
    </div>

  </div>
</div>

<style>

<script>
/* ── State ─────────────────────────────────────────── */
let _rsdCurrentRow  = null;   // full result row object currently open
let _rsdQExpanded   = false;  // whether question detail is expanded

/* ════════════════════════════════════════════════════
   openResultDrawer(row)
   Call this with the full result row object.
   row must have at minimum:
     { fullname, regNum, department, overAll, createdAt,
       publish, subjectAndScore }
   subjectAndScore is JSON string:
     [{ subject, score, correctAnswers, totalQuestions,
        scorePerQuestion?, expectedScore? }]
════════════════════════════════════════════════════ */
function openResultDrawer(row) {
  _rsdCurrentRow = row;
  _rsdQExpanded  = false;
  document.getElementById('rsdToggleQBtn').innerHTML =
    '<i class="fas fa-chevron-down" id="rsdToggleIcon"></i> Show Details';
  document.getElementById('rsdQuestionDetail').style.display = 'none';

  /* Avatar initials */
  const initials = (row.fullname || '??').split(' ')
    .map(w => w[0]).join('').substring(0, 2).toUpperCase();
  document.getElementById('rsdAvatar').textContent = initials;

  /* Header */
  document.getElementById('rsdName').textContent = row.fullname || '—';
  document.getElementById('rsdReg').textContent  = row.regNum   || '—';

  /* Chips */
  document.getElementById('rsdChipDept').textContent = row.department || '—';
  const isPublished = _isPublished(row.publish);
  const chipEl = document.getElementById('rsdChipStatus');
  chipEl.textContent = isPublished ? '✓ Published' : '⏳ Pending';
  chipEl.className = 'rsd-chip rsd-chip-status ' + (isPublished ? 'published' : 'unpublished');

  /* Score hero */
  document.getElementById('rsdScoreBig').textContent   = row.overAll   || '—';
  document.getElementById('rsdMetaName').textContent   = row.fullname  || '—';
  document.getElementById('rsdMetaReg').textContent    = row.regNum    || '—';
  document.getElementById('rsdMetaDept').textContent   = row.department|| '—';
  document.getElementById('rsdMetaDate').textContent   = row.createdAt || '—';

  /* Publish button state */
  const pubBtn = document.getElementById('rsdPublishBtn');
  document.getElementById('rsdPublishLabel').textContent = isPublished ? 'Published' : 'Not yet published';
  if (isPublished) {
    pubBtn.innerHTML = '<i class="fas fa-check-circle"></i> Already Published';
    pubBtn.className = 'rsd-publish-btn already-published';
  } else {
    pubBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Publish Result';
    pubBtn.className = 'rsd-publish-btn';
  }

  /* Parse subjects */
  let subjects = [];
  try {
    subjects = JSON.parse(row.subjectAndScore || '[]');
  } catch (_) { subjects = []; }

  /* Summary pills */
  const totalQ    = subjects.reduce((s, r) => s + (parseInt(r.totalQuestions)  || 0), 0);
  const totalCorr = subjects.reduce((s, r) => s + (parseInt(r.correctAnswers)  || 0), 0);
  const pct       = totalQ > 0 ? Math.round((totalCorr / totalQ) * 100) : 0;
  document.getElementById('rsdSumSubjects').textContent = subjects.length || '—';
  document.getElementById('rsdSumTotalQ').textContent   = totalQ  || '—';
  document.getElementById('rsdSumCorrect').textContent  = totalCorr;
  document.getElementById('rsdSumPercent').textContent  = totalQ ? pct + '%' : '—';

  /* Render subject cards */
  _renderSubjectCards(subjects);

  /* Open drawer */
  document.getElementById('rsdBackdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
}

/* ── Close ──────────────────────────────────────────── */
function closeResultDrawer() {
  document.getElementById('rsdBackdrop').classList.remove('open');
  document.body.style.overflow = '';
  _rsdCurrentRow = null;
}

/* ── Render subject breakdown cards ─────────────────── */
function _renderSubjectCards(subjects) {
  const area = document.getElementById('rsdSubjectArea');
  if (!subjects || !subjects.length) {
    area.innerHTML = `
      <div class="rsd-empty">
        <i class="fas fa-folder-open"></i>
        No subject breakdown available for this result.
      </div>`;
    return;
  }

  area.innerHTML = `<div class="rsd-subj-cards">${subjects.map(s => {
    const score      = parseFloat(s.score)          || 0;
    const correct    = parseInt(s.correctAnswers)    || 0;
    const total      = parseInt(s.totalQuestions)    || 0;
    const spq        = parseFloat(s.scorePerQuestion || (total > 0 ? score / correct : 0)) || 0;
    const expected   = parseFloat(s.expectedScore)   || (total * spq);
    const pct        = expected > 0 ? Math.min(Math.round((score / expected) * 100), 100) : 0;

    return `
      <div class="rsd-subj-card">
        <div>
          <div class="rsd-subj-name">${s.subject || '—'}</div>
          <div class="rsd-subj-stats">
            <span class="rsd-subj-stat">
              <i class="fas fa-circle-question"></i>
              ${total} question${total !== 1 ? 's' : ''}
            </span>
            <span class="rsd-subj-stat">
              <i class="fas fa-check"></i>
              ${correct} correct
            </span>
            <span class="rsd-subj-stat">
              <i class="fas fa-times"></i>
              ${total - correct} wrong
            </span>
            ${spq > 0 ? `
            <span class="rsd-subj-stat">
              <i class="fas fa-star-half-stroke"></i>
              ${spq} pt/question
            </span>` : ''}
          </div>
          <div class="rsd-progress-wrap">
            <div class="rsd-progress-track">
              <div class="rsd-progress-fill" style="width:${pct}%"></div>
            </div>
            <div class="rsd-progress-label">${pct}% of expected score</div>
          </div>
        </div>
        <div class="rsd-subj-score-box">
          <div class="rsd-subj-score-num">${score}</div>
          <div class="rsd-subj-score-label">score</div>
        </div>
      </div>`;
  }).join('')}</div>`;
}

/* ── Toggle question detail ─────────────────────────── */
function toggleQuestionDetail() {
  _rsdQExpanded = !_rsdQExpanded;
  const area   = document.getElementById('rsdQuestionDetail');
  const btn    = document.getElementById('rsdToggleQBtn');
  const icon   = document.getElementById('rsdToggleIcon');

  if (_rsdQExpanded) {
    area.style.display = 'block';
    btn.innerHTML = '<i class="fas fa-chevron-up" id="rsdToggleIcon"></i> Hide Details';
    _loadQuestionDetail();
  } else {
    area.style.display = 'none';
    btn.innerHTML = '<i class="fas fa-chevron-down" id="rsdToggleIcon"></i> Show Details';
  }
}

/* ── Load per-question attempt detail ───────────────── */
async function _loadQuestionDetail() {
  const area = document.getElementById('rsdQuestionDetail');
  if (!_rsdCurrentRow) return;

  area.innerHTML = `
    <div class="rsd-loading">
      <i class="fas fa-circle-notch fa-spin"></i> Loading question attempts…
    </div>`;

  try {
    const res    = await fetch('/cbt/ansofra/apiadmin/student/questions/attempt', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ regNum: _rsdCurrentRow.regNum })
    });
    const data = await res.json();

    if (data.status === 'success' && data.response) {
      /* response may be a JSON string or already an array/object */
      let attempts = data.response;
      if (typeof attempts === 'string') {
        try { attempts = JSON.parse(attempts); } catch (_) {}
      }
      /* attempts can be array or object keyed question_0, question_1 … */
      let rows = Array.isArray(attempts)
        ? attempts
        : Object.values(attempts);

      if (!rows.length) throw new Error('empty');
      _renderQuestionTable(rows, area);
    } else {
      throw new Error('no data');
    }
  } catch (_) {
    area.innerHTML = `
      <div class="rsd-empty">
        <i class="fas fa-inbox"></i>
        No per-question attempt data available for this student.
      </div>`;
  }
}

/* ── Render per-question table ──────────────────────── */
function _renderQuestionTable(rows, container) {
  /* Group by subject */
  const bySubject = {};
  rows.forEach(r => {
    const subj = r.subject || 'General';
    if (!bySubject[subj]) bySubject[subj] = [];
    bySubject[subj].push(r);
  });

  let html = '<div class="rsd-q-table-wrap">';
  Object.entries(bySubject).forEach(([subj, qs]) => {
    html += `
      <div style="font-size:11.5px;font-weight:700;color:#334155;
                  font-family:'Inter',sans-serif;margin:12px 0 6px;
                  padding-bottom:4px;border-bottom:1px solid #E2E8F0;">
        <i class="fas fa-book" style="color:#2563EB;margin-right:6px;font-size:11px"></i>${subj}
      </div>
      <table class="rsd-q-table">
        <thead>
          <tr>
            <th>#</th>
            <th style="min-width:220px">Question</th>
            <th>Your Answer</th>
            <th>Correct Ans.</th>
            <th>Result</th>
          </tr>
        </thead>
        <tbody>`;

    qs.forEach((q, idx) => {
      const attempted  = q.attempted === true || q.attempted === 'true' || q.attempted === 1;
      const answered   = q.optionPicked && q.answerPicked;
      const isCorrect  = attempted && answered &&
        (q.answerPicked || '').toUpperCase().trim() ===
        (q.correctAns  || '').toUpperCase().trim();

      let badge;
      if (!attempted || !answered) {
        badge = '<span class="rsd-q-skipped"><i class="fas fa-minus"></i> Skipped</span>';
      } else if (isCorrect) {
        badge = '<span class="rsd-q-correct"><i class="fas fa-check"></i> Correct</span>';
      } else {
        badge = '<span class="rsd-q-wrong"><i class="fas fa-times"></i> Wrong</span>';
      }

      /* Truncate long question text */
      const qText = (q.questiontext || '—').length > 80
        ? (q.questiontext || '').substring(0, 80) + '…'
        : (q.questiontext || '—');

      html += `
        <tr>
          <td class="rsd-q-num">Q${idx + 1}</td>
          <td title="${(q.questiontext||'').replace(/"/g,'&quot;')}">${qText}</td>
          <td style="font-weight:600;color:#0F172A">${q.optionPicked || '—'}</td>
          <td style="font-weight:600;color:#16A34A">${q.correctAns  || '—'}</td>
          <td>${badge}</td>
        </tr>`;
    });
    html += '</tbody></table>';
  });
  html += '</div>';
  container.innerHTML = html;
}

/* ── Publish single result ──────────────────────────── */
async function publishSingleResult() {
  if (!_rsdCurrentRow) return;
  if (_isPublished(_rsdCurrentRow.publish)) return;

  const btn = document.getElementById('rsdPublishBtn');
  btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Publishing…';
  btn.disabled  = true;

  try {
    const res    = await fetch('/cbt/ansofra/apiadmin/publish/single/result', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ regNum: _rsdCurrentRow.regNum })
    });
    const data = await res.json();
    if (data.status === 'success') {
      _rsdCurrentRow.publish = 'yes';
      /* update chip */
      const chip = document.getElementById('rsdChipStatus');
      chip.textContent = '✓ Published';
      chip.className   = 'rsd-chip rsd-chip-status published';
      /* update label */
      document.getElementById('rsdPublishLabel').textContent = 'Published';
      btn.innerHTML   = '<i class="fas fa-check-circle"></i> Already Published';
      btn.className   = 'rsd-publish-btn already-published';
      btn.disabled    = false;
      /* refresh the main result table if it's loaded */
      if (typeof loadResultsDashboard === 'function') loadResultsDashboard();
    } else {
      alert(data.response || 'Could not publish result. Please try again.');
      btn.innerHTML = '<i class="fas fa-paper-plane"></i> Publish Result';
      btn.disabled  = false;
    }
  } catch (err) {
    alert('Network error. Please try again.');
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Publish Result';
    btn.disabled  = false;
  }
}

/* ── Print ──────────────────────────────────────────── */
function printStudentResult() { window.print(); }

/* ── Helper ─────────────────────────────────────────── */
function _isPublished(val) {
  const v = String(val || '').toLowerCase().trim();
  return v === 'yes' || v === '1' || v === 'true';
}

/* ── ESC closes drawer ──────────────────────────────── */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeResultDrawer();
});
</script>
